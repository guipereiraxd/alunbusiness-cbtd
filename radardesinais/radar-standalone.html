<style>
:root{
  --bg:#F0F0EE; --panel:#FFFFFF; --ink:#1D3557; --muted:#5F6B7A; --faint:#8A93A0;
  --line:#E2E2E0; --olive:#7E9B57; --gold:#D9A82E; --orange:#E07B2A; --red:#C93A2B;
  --purple:#7B3FA0; --blue:#3E7CB1; --ground:#E9EEE3;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --display:'Jost',var(--sans); --px:'Press Start 2P',monospace;
  --maxw:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
svg{display:block;max-width:100%}

/* ---------- top bar ---------- */
header.bar{position:sticky;top:0;z-index:50;background:rgba(240,240,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--px);font-size:11px;letter-spacing:1px;white-space:nowrap}
nav.cells{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.cells::-webkit-scrollbar{display:none}
nav.cells a{flex:0 0 auto;font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--muted);
  border:1.5px solid var(--line);border-radius:6px;padding:5px 9px;background:var(--panel);transition:.15s}
nav.cells a:hover,nav.cells a.on{color:var(--ink);border-color:currentColor}

/* ---------- hero ---------- */
.hero{padding:44px 0 8px}
h1{font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:clamp(30px,7vw,58px);margin:0 0 12px}
.lede{font-size:clamp(15px,3.4vw,23px);font-weight:500;opacity:.82;margin:0;max-width:52ch;line-height:1.45}

/* ---------- radar ---------- */
.radarwrap{background:var(--panel);border-radius:16px;padding:8px;margin:22px 0}
/* só aparece quando a frase sai do disco central — ver buildRadar */
.centro-nota{display:none}
@media(max-width:820px){
  .centro-nota{display:block;font-family:var(--mono);font-size:13px;color:var(--muted);
    margin:10px 0 0;text-align:center}
  .centro-nota b{color:var(--ink);font-weight:500}
}
.radar-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:14px 0 4px}
.rl{display:flex;gap:8px;align-items:flex-start;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.rl b{color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:600;display:block}

/* ---------- formation list ---------- */
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:18px 0 8px}
.fcard{display:block;text-decoration:none;color:inherit;background:var(--panel);border-radius:12px;padding:14px 16px;
  border-left:6px solid var(--c);transition:.18s;position:relative}
.fcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(29,53,87,.08)}
.fcard h3{margin:0 0 3px;font-size:18px;font-weight:600}
.fcard .st{font-family:var(--mono);font-size:11.5px;color:var(--c);letter-spacing:.03em}
.fcard .mv{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.fcard .ac{position:absolute;top:14px;right:14px;font-family:var(--mono);color:var(--c);font-size:15px}

/* ---------- cell sections ---------- */
section.cell{padding:40px 0 8px;border-top:1px solid var(--line);margin-top:34px;scroll-margin-top:72px}
.chip{display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;
  border:2px solid var(--c);color:var(--c);background:var(--panel);border-radius:5px;padding:3px 9px;margin-bottom:10px}
h2{font-family:var(--display);font-weight:600;letter-spacing:.05em;font-size:clamp(24px,5.4vw,44px);margin:0 0 8px}
.real{font-size:clamp(14px,3.2vw,21px);font-weight:500;opacity:.82;margin:0 0 6px;max-width:56ch}
.stat{font-family:var(--mono);font-size:13px;color:var(--c);margin-bottom:16px}
.cloudbox{background:var(--panel);border-radius:14px;padding:6px;overflow:hidden}
/* No estreito a anatomia não cabe: em vez de cortar os rótulos dos sinais,
   a caixa rola na horizontal. Abaixo de 900px o texto ficaria ilegível. */
@media(max-width:900px){
  .cloudbox{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .cloudbox svg{min-width:900px}
}

.grid2{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media(min-width:880px){.grid2{grid-template-columns:1.35fr 1fr}}
.card{background:var(--panel);border-radius:12px;padding:16px 18px}
.card h4{font-family:var(--px);font-size:11px;margin:0 0 14px;color:var(--ink);letter-spacing:.04em}

/* signals */
.sig{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
  position:relative;scroll-margin-top:76px;border-radius:8px;
  transition:box-shadow .45s ease,background-color .45s ease}
.sig:last-child{border-bottom:0}
/* sinal alcançado por deep-link — destaque que se apaga sozinho */
.sig.alvo{box-shadow:0 0 0 2px var(--sc);background:rgba(29,53,87,.045)}
.sig .tag{flex:0 0 auto;font-family:var(--mono);font-size:12px;border:2px solid var(--sc);color:var(--sc);
  border-radius:5px;padding:2px 7px;height:fit-content;
  background:none;cursor:pointer;line-height:1.35;transition:background-color .15s,color .15s;
  position:relative}
/* o chip tem 32x24; isto leva o alvo de toque a ~48x46 sem mudar o desenho */
.sig .tag::after{content:'';position:absolute;inset:-11px -8px}
.sig .tag:hover,.sig .tag:focus-visible{background:var(--sc);color:#fff}
.sig .aviso{position:absolute;left:0;top:-6px;transform:translateY(-100%);z-index:5;
  background:var(--ink);color:#fff;font-family:var(--mono);font-size:11.5px;line-height:1.4;
  padding:5px 9px;border-radius:5px;max-width:min(340px,92%);pointer-events:none;word-break:break-word}
.sig .aviso.copiavel{pointer-events:auto;user-select:all;-webkit-user-select:all}
.dica{display:block;font-family:var(--mono);font-size:11.5px;color:var(--faint);
  letter-spacing:0;margin-top:6px;text-transform:none}
@media (prefers-reduced-motion:reduce){.sig,.sig .tag{transition:none}}
.sig .nm{font-weight:600;font-size:16px;line-height:1.3}
.sig .role{font-family:var(--mono);font-size:12px;color:var(--sc);margin:3px 0 4px}
.sig .ev{font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.55}

/* diagnostic */
.dg{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-family:var(--mono);font-size:13px}
.dg .k{color:var(--faint)}
.dg .v{color:var(--c);font-size:15px;letter-spacing:1px}
.dg .l{font-family:var(--sans);font-weight:600;font-size:14px;text-align:right}
/* forces */
.fz{margin-top:6px}
.fz .h{font-family:var(--mono);font-size:13.5px;margin:14px 0 6px}
.fz .up{color:var(--red)} .fz .dn{color:var(--blue)}
.fz li{font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.7;list-style:none}
.fz ul{margin:0;padding-left:12px}
/* forecast */
.fore{background:var(--panel);border-radius:12px;padding:16px 18px;margin-top:16px;border-top:5px solid var(--c)}
.fore .k{font-family:var(--px);font-size:11px;color:var(--c);margin-bottom:10px}
.fore p{margin:0 0 8px;font-size:clamp(15px,3vw,20px);font-weight:600;line-height:1.4}
.fore .se{font-family:var(--mono);font-size:13px;color:var(--muted);margin:0;line-height:1.6}

/* system */
.sys{display:grid;grid-template-columns:1fr;gap:10px;margin:16px 0}
@media(min-width:820px){.sys{grid-template-columns:repeat(5,1fr)}}
.lvl{background:var(--panel);border-radius:12px;padding:14px 16px;border-top:6px solid var(--c)}
.lvl .n{font-family:var(--px);font-size:11px;color:var(--c)}
.lvl .d{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:6px}
.lvl .b{font-size:15px;font-weight:600;margin-top:10px;line-height:1.35}
.routes{display:grid;gap:8px;margin-top:8px}
.rt{background:var(--panel);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.rt b{font-family:var(--mono);font-size:13px;color:var(--red)}
.rt span{font-size:15px;font-weight:500}
.rt.main{border-left:5px solid var(--red)}
footer{padding:44px 0 60px;font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center}
.kicker{font-family:var(--px);font-size:11px;color:var(--faint);letter-spacing:.05em;margin:36px 0 10px}

@media (prefers-reduced-motion:no-preference){
  @keyframes sweep{to{transform:rotate(360deg)}}
  @keyframes corepulse{0%,100%{opacity:1}50%{opacity:.55}}
  @keyframes dashmove{to{stroke-dashoffset:-32}}
  @keyframes rise{0%{transform:translateY(0);opacity:.75}100%{transform:translateY(-52px);opacity:0}}
  @keyframes shear{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
  .sweep{animation:sweep 8s linear infinite}
  .pulse{animation:corepulse 2s ease-in-out infinite}
  .collide{animation:dashmove 1.6s linear infinite}
  .rise{animation:rise 1.9s linear infinite}
  .rise2{animation-delay:.6s}.rise3{animation-delay:1.2s}
  .shearg{animation:shear 2.6s ease-in-out infinite}
}
</style>

<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const T=(x,y,size,weight,fill,txt,anchor,fam)=>{const t=el('text',{x,y,'font-size':size,'font-weight':weight,fill,
  'font-family':fam||'var(--mono)'});if(anchor)t.setAttribute('text-anchor',anchor);t.textContent=txt;return t;};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const attr=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
/* Abaixo disto o radar cai para escala ~0,25 e o texto no tamanho do desktop
   sairia com 4-5px. O radar continua inteiro na tela; o que muda é a
   tipografia — ver o ramo `estreito` em buildRadar. */
const isNarrow=()=>window.matchMedia('(max-width:820px)').matches;

let D;
const inline=document.getElementById('signals-data');
if(inline){ D=JSON.parse(inline.textContent); boot(); }
else fetch('signals.json').then(r=>r.json()).then(d=>{D=d;boot();})
  .catch(()=>{document.getElementById('lede').textContent='Não foi possível carregar signals.json — sirva os arquivos por HTTP (ex.: python3 -m http.server) ou use a versão standalone.';});

function boot(){
  document.getElementById('lede').textContent=D.meta.sub;
  document.getElementById('fecho').textContent=D.meta.evento+' · '+D.meta.fecho;
  buildNav(); buildRadar(); buildLegend(); buildForms(); D.celulas.forEach(buildCell); buildSystem();
  ligarDeepLinks();
  let t; window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>{
    document.getElementById('radar').innerHTML=''; buildRadar();
    D.celulas.forEach(c=>{const h=document.getElementById('cloud-'+c.id); if(h){h.innerHTML='';drawCloud(h,c);}});
  },220);});
}

/* ============ DEEP-LINK POR SINAL ============
   #C1-S3 abre direto no sinal. Três cuidados:
   - a página é montada por JS depois do fetch, então o salto nativo do
     navegador não encontra o alvo — o salto inicial é nosso;
   - as webfonts mudam a altura do conteúdo ao carregar, o que desalinharia o
     scroll — por isso ele espera document.fonts;
   - no standalone (file://) a área de transferência é bloqueada e o caminho
     local não serviria a ninguém, então o link copiado vem do <link canonical>. */
function ligarDeepLinks(){
  document.addEventListener('click',e=>{
    const b=e.target.closest('button.tag[data-sinal]');
    if(b) copiarLink(b.dataset.sinal);
  });
  addEventListener('hashchange',()=>irParaHash(false));
  const saltar=()=>irParaHash(true);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>requestAnimationFrame(saltar));
  else requestAnimationFrame(saltar);
}

function irParaHash(inicial){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h) return;
  let alvo=document.getElementById(h);
  /* id em HTML diferencia maiúsculas; #c1-s3 digitado à mão tem que funcionar */
  if(!alvo && /^c\d+(-s\d+)?$/i.test(h)) alvo=document.getElementById(h.toUpperCase());
  /* sinal que não existe mais cai na célula dele, em vez de não ir a lugar nenhum */
  if(!alvo && /^c\d+-s\d+$/i.test(h)) alvo=document.getElementById(h.split('-')[0].toUpperCase());
  if(!alvo) return;
  const sinal=alvo.classList.contains('sig');
  alvo.scrollIntoView({block:sinal?'center':'start',behavior:inicial?'auto':'smooth'});
  if(sinal) destacar(alvo);
}

function destacar(el){
  document.querySelectorAll('.sig.alvo').forEach(s=>s.classList.remove('alvo'));
  el.classList.add('alvo');
  clearTimeout(destacar.t);
  destacar.t=setTimeout(()=>el.classList.remove('alvo'),3600);
}

function copiarLink(id){
  const sig=document.getElementById(id);
  const base=(document.querySelector('link[rel=canonical]')||{}).href
             || location.href.split('#')[0];
  const url=base.split('#')[0]+'#'+id;
  /* a barra de endereços passa a mostrar o link mesmo se a cópia falhar */
  try{ history.replaceState(null,'','#'+id); }catch(_){ }
  if(sig) destacar(sig);
  const ok=()=>aviso(sig,'link copiado');
  /* Sem clipboard (standalone em file://, contexto não seguro, permissão
     negada) mostramos o próprio link para copiar à mão. Não dá para mandar
     olhar a barra de endereços: no standalone ela tem um caminho local. */
  const naoDeu=()=>aviso(sig,'copie este link: '+url,true);
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(url).then(ok,naoDeu);
  else naoDeu();
}

function aviso(sig,txt,copiavel){
  if(!sig) return;
  sig.querySelectorAll('.aviso').forEach(a=>a.remove());
  const a=document.createElement('div');
  a.className='aviso'+(copiavel?' copiavel':''); a.textContent=txt;
  a.setAttribute('role','status');
  sig.appendChild(a);
  setTimeout(()=>a.remove(),copiavel?9000:2200);
}

  D.celulas.forEach(c=>{const a=document.createElement('a');a.href='#'+c.id;a.textContent=c.id+' · '+c.nome;n.appendChild(a);});
}

/* ============ RADAR ============ */
function buildRadar(){
  const host=document.getElementById('radar');
  const estreito=isNarrow(), S=1280, CX=640, CY=600, R=392;
  const svg=el('svg',{viewBox:`0 130 ${S} 940`,role:'img','aria-label':'Radar de sinais com seis formações'});
  svg.appendChild(el('circle',{cx:CX,cy:CY,r:R,fill:'#fff'}));
  /* O rótulo de cada anel fica na borda de cima dele, por dentro. No anel mais
     interno essa posição cai dentro do disco central, que é pintado depois —
     era por isso que AGORA nunca aparecia. Esses ficam para o grupo do olho. */
  const DISCO=104, aneisNoOlho=[];
  D.aneis.forEach((a,i)=>{
    svg.appendChild(el('circle',{cx:CX,cy:CY,r:a.r,fill:'none',stroke:'#1D3557','stroke-width':i?1:1.5,opacity:i?.22:.45}));
    if(a.r-26>DISCO) svg.appendChild(T(CX,CY-a.r+(estreito?34:26),estreito?32:14,500,'#8A93A0',a.nome,'middle'));
    else aneisNoOlho.push(a);
  });
  const sw=el('g',{class:'sweep',style:`transform-origin:${CX}px ${CY}px`});
  sw.appendChild(el('path',{d:`M${CX} ${CY} L${CX+R} ${CY} A${R} ${R} 0 0 0 ${CX+R*0.866} ${CY-R*0.5} Z`,fill:'#3E7CB1',opacity:.07}));
  sw.appendChild(el('line',{x1:CX,y1:CY,x2:CX+R,y2:CY,stroke:'#3E7CB1','stroke-width':2,opacity:.3}));
  svg.appendChild(sw);

  /* C6 ring + center + rota de colisão principal.
     O olho vem ANTES das células: a rota passa por cima do anel (é o que ela
     atravessa) mas por baixo do disco central e das próprias células. */
  const c6=D.celulas.find(c=>c.olho), eg=el('g',{style:'cursor:pointer'});
  eg.addEventListener('click',()=>location.hash='#C6');
  const r6=mul(c6.seed);
  for(let a=0;a<Math.PI*2;a+=.06)for(let rr=124;rr<=168;rr+=16){
    if(r6()<.42)continue;
    const x=Math.round((CX+Math.cos(a)*rr)/16)*16, y=Math.round((CY+Math.sin(a)*rr)/16)*16;
    eg.appendChild(el('rect',{x:x-6.5,y:y-6.5,width:13,height:13,fill:rr<148?'#3E7CB1':'#8FB7D6',opacity:.8}));
  }
  const rt=D.colisoes.find(r=>r.principal), rota=rotaPrincipal(rt,CX,CY);
  if(rota) eg.appendChild(el('path',{d:rota,fill:'none',stroke:'#1D3557','stroke-width':2.5,
    'stroke-dasharray':'12 10',opacity:.55,class:'collide'}));
  eg.appendChild(el('circle',{cx:CX,cy:CY,r:104,fill:'#fff'}));
  eg.appendChild(el('circle',{cx:CX,cy:CY,r:104,fill:'none',stroke:'#3E7CB1','stroke-width':2,'stroke-dasharray':'9 7'}));
  aneisNoOlho.forEach((a,i)=>eg.appendChild(
    T(CX,CY-(estreito?52:72)+i*24,estreito?32:14,500,'#8A93A0',a.nome,'middle')));
  /* O disco tem 208 unidades — 52px de tela no celular. A frase não cabe ali
     em tamanho legível (medida, "DE SOFTWARE" dá 220 unidades), então no
     estreito ela sai do disco e vira a legenda logo abaixo do radar. */
  if(estreito){
    eg.appendChild(T(CX,CY+10,30,500,'#5F6B7A','você aqui','middle'));
  } else {
    eg.appendChild(T(CX,CY-8,20,600,'#1D3557','ENGENHARIA DE','middle','var(--sans)'));
    eg.appendChild(T(CX,CY+18,20,600,'#1D3557','SOFTWARE HOJE','middle','var(--sans)'));
    eg.appendChild(T(CX,CY+44,13,500,'#8A93A0','você aqui','middle'));
  }
  /* Rótulo da C6. Ela fica de fora do laço das células por ser o olho, e sem
     isto é a única formação sem identificação no radar. Não cabe centralizada
     sob o anel (esbarra na C2), então vai deslocada para a direita, com uma
     guia curta ligando-a ao anel. */
  if(estreito){
    eg.appendChild(el('rect',{x:CX-43,y:800,width:86,height:58,rx:6,fill:'#fff',stroke:c6.cor,'stroke-width':4}));
    eg.appendChild(T(CX,841,42,500,c6.cor,c6.id,'middle'));
  } else {
    const w=44+16+c6.nome.length*11.4, lx=596, ly=856;
    eg.appendChild(el('line',{x1:lx+30,y1:ly-30,x2:CX,y2:CY+176,stroke:c6.cor,'stroke-width':1.5,
      'stroke-dasharray':'5 6',opacity:.55}));
    eg.appendChild(el('rect',{x:lx-8,y:ly-24,width:w+16,height:34,rx:5,fill:'#fff',opacity:.93}));
    eg.appendChild(el('rect',{x:lx,y:ly-20,width:44,height:26,fill:'#fff',stroke:c6.cor,'stroke-width':2}));
    eg.appendChild(T(lx+22,ly-1,14,500,c6.cor,c6.id,'middle'));
    eg.appendChild(T(lx+56,ly,21,600,'#1D3557',c6.nome,null,'var(--sans)'));
  }
  svg.appendChild(eg);

  D.celulas.filter(c=>!c.olho).forEach(c=>{
    const g=el('g',{style:'cursor:pointer'}); g.addEventListener('click',()=>location.hash='#'+c.id);
    const rnd=mul(c.seed), sc=Math.sqrt(c.n/6), rx=104*sc, ry=74*sc, bands=D.rampas[c.rampa];
    const gc=el('g',{class:'pulse'}), gr=el('g');
    for(let x=c.x-rx-16;x<=c.x+rx+16;x+=16)for(let y=c.y-ry-16;y<=c.y+ry+16;y+=16){
      const rc=Math.hypot(x-CX,y-CY); if(rc>R-16||rc<150)continue;
      const dd=Math.hypot((x-c.x)/rx,(y-c.y)/ry)+(rnd()-.5)*.15; if(dd>1)continue;
      if(rnd()<Math.max(0,dd-.66)*1.8)continue;
      let col=bands[bands.length-1][1],core=false;
      for(const b of bands){if(dd<b[0]){col=b[1];core=(b===bands[0]);break;}}
      (core?gc:gr).appendChild(el('rect',{x:x-6.5,y:y-6.5,width:13,height:13,fill:col,opacity:core?1:(0.85-dd*.25).toFixed(2)}));
    }
    g.appendChild(gr);g.appendChild(gc);
    const V={SE:[1,1],NE:[1,-1],E:[1,0]}[c.vetor];
    if(V){const n=Math.hypot(...V),nx=V[0]/n,ny=V[1]/n,sx=c.x+nx*(rx-14),sy=c.y+ny*(ry+6),L=48;
      g.appendChild(el('line',{x1:sx,y1:sy,x2:sx+nx*L,y2:sy+ny*L,stroke:'#1D3557','stroke-width':3,opacity:.8}));
      const ex=sx+nx*L,ey=sy+ny*L,a=Math.atan2(ny,nx);
      g.appendChild(el('path',{d:`M${ex} ${ey} L${ex-Math.cos(a-.5)*15} ${ey-Math.sin(a-.5)*15} L${ex-Math.cos(a+.5)*15} ${ey-Math.sin(a+.5)*15} Z`,fill:'#1D3557',opacity:.8}));
    }
    if(estreito){
      /* só o chip, ampliado para continuar legível a 0,25 de escala; os nomes
         estão logo abaixo, nos cartões FORMAÇÕES DETECTADAS */
      const by=c.y>CY+40?(c.y+ry+18):(c.y-ry-76);
      g.appendChild(el('rect',{x:c.x-43,y:by,width:86,height:58,rx:6,fill:'#fff',stroke:c.cor,'stroke-width':4}));
      g.appendChild(T(c.x,by+41,42,500,c.cor,c.id,'middle'));
    } else {
      const w=44+16+c.nome.length*11.4;
      const below=c.y>CY+40;
      let lx=c.x-w/2, ly=below?(c.y+ry+52):(c.y-ry-24);
      lx=Math.max(CX-R-40,Math.min(lx,CX+R-w+40));
      g.appendChild(el('rect',{x:lx-8,y:ly-24,width:w+16,height:34,rx:5,fill:'#fff',opacity:.93}));
      g.appendChild(el('rect',{x:lx,y:ly-20,width:44,height:26,fill:'#fff',stroke:c.cor,'stroke-width':2}));
      g.appendChild(T(lx+22,ly-1,14,500,c.cor,c.id,'middle'));
      g.appendChild(T(lx+56,ly,21,600,'#1D3557',c.nome,null,'var(--sans)'));
    }
    svg.appendChild(g);
  });

  /* no estreito este bloco sairia com 4px; a lista de rotas fica abaixo do radar */
  if(!estreito){
    svg.appendChild(el('rect',{x:784,y:480,width:216,height:56,rx:5,fill:'#fff',opacity:.93}));
    svg.appendChild(T(794,504,15,500,'#C93A2B','ROTA DE COLISÃO'));
    svg.appendChild(T(794,526,14,500,'#5F6B7A',rt.rota+' → tempestade'));
  }
  host.appendChild(svg);
}

/* Traça a rota entre as BORDAS das duas células da colisão principal, lidas do
   JSON — nada de coordenadas fixas. As duas ficam quase diametralmente opostas
   no radar, então a rota passa pelo olho: por isso ela é desenhada por baixo do
   disco central, e não por cima. */
function rotaPrincipal(rt,CX,CY){
  if(!rt) return null;
  const [ia,ib]=rt.rota.split('×').map(s=>s.trim());
  const A=D.celulas.find(c=>c.id===ia), B=D.celulas.find(c=>c.id===ib);
  if(!A||!B||A.olho||B.olho) return null;
  const borda=(c,tx,ty)=>{
    const sc=Math.sqrt(c.n/6), rx=104*sc, ry=74*sc;
    const dx=tx-c.x, dy=ty-c.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    const s=1/Math.hypot(ux/rx,uy/ry);
    return [(c.x+ux*s).toFixed(1),(c.y+uy*s).toFixed(1)];
  };
  const [x1,y1]=borda(A,B.x,B.y), [x2,y2]=borda(B,A.x,A.y);
  return `M${x1} ${y1} Q${CX} ${CY} ${x2} ${y2}`;
}

/* ============ CELL ANATOMY ============ */
function drawCloud(host,c){
  /* Composição única, com as duas colunas de rótulo. No estreito ela não cabe
     na largura da tela — em vez de cortar (o que escondia os sinais), a caixa
     rola na horizontal, ver `.cloudbox` no CSS. */
  const svg=el('svg',{viewBox:'40 180 1220 760',role:'img',
    'aria-label':'Anatomia da formação '+c.nome});
  svg.appendChild(el('rect',{x:60,y:180,width:1180,height:740,rx:16,fill:'#fff'}));
  [404,646].forEach(y=>svg.appendChild(el('line',{x1:112,y1:y,x2:1224,y2:y,stroke:'#1D3557','stroke-width':1,'stroke-dasharray':'7 9',opacity:.2})));
  svg.appendChild(el('rect',{x:64,y:184,width:46,height:732,fill:'#F5F5F3'}));
  [[300,'FRONTEIRA'],[528,'ESCALANDO'],[770,'EM PRODUÇÃO']].forEach(([y,t])=>{
    const n=T(87,y,14,500,'#8A93A0',t,'middle');n.setAttribute('transform',`rotate(-90 87 ${y})`);svg.appendChild(n);});
  /* rain */
  const rg=el('g'),rr=mul(97);
  let x0=1e9,x1=-1e9;
  c.puffs.forEach(([px,py,rx])=>{if(py>700){x0=Math.min(x0,px-rx*.78);x1=Math.max(x1,px+rx*.78);}});
  if(x0>x1){x0=c.puffs[0][0]-c.puffs[0][2]*.78;x1=c.puffs[0][0]+c.puffs[0][2]*.78;}
  for(let x=x0;x<=x1;x+=20){ if(rr()<.22)continue;
    const y=826+rr()*10,len=16+rr()*14;
    rg.appendChild(el('line',{x1:x,y1:y,x2:x-4,y2:Math.min(y+len,868),stroke:'#3E7CB1','stroke-width':2,opacity:.4}));}
  svg.appendChild(rg);
  /* cloud */
  const cg=el('g',{transform:'translate(0,-30) scale(1,0.93)'});
  const rnd=mul(c.seed),bands=D.rampas[c.rampa],gc=el('g',{class:'pulse'}),gr=el('g');
  for(let x=96;x<=1200;x+=16)for(let y=224;y<=912;y+=16){
    let ins=false;for(const [px,py,rx,ry] of c.puffs){if(Math.hypot((x-px)/rx,(y-py)/ry)<1){ins=true;break;}}
    if(!ins)continue;
    const dd=Math.hypot(x-c.core[0],y-c.core[1])/c.corer+(rnd()-.5)*.14;
    if(rnd()<Math.max(0,dd-.62)*1.5)continue;
    let col=bands[bands.length-1][1],core=false;
    for(const b of bands){if(dd<b[0]){col=b[1];core=(b===bands[0]);break;}}
    (core?gc:gr).appendChild(el('rect',{x:x-6.5,y:y-6.5,width:13,height:13,fill:col,opacity:core?1:(0.85-dd*.28).toFixed(2)}));
  }
  cg.appendChild(gr);cg.appendChild(gc);
  /* updraft */
  [[496,900,''],[536,904,'rise2'],[576,898,'rise3']].forEach(([x,y,cl])=>
    cg.appendChild(el('rect',{x,y,width:10,height:10,fill:'#1D3557',opacity:.6,class:'rise '+cl})));
  /* shear */
  const sg=el('g',{class:'shearg',stroke:'#1D3557','stroke-width':2.5,opacity:.65,'stroke-dasharray':'10 8'});
  [712,740,768].forEach((y,i)=>sg.appendChild(el('line',{x1:1140,y1:y,x2:760-i*14,y2:y})));
  cg.appendChild(sg);
  [712,740,768].forEach((y,i)=>{const x=744-i*14;
    cg.appendChild(el('path',{d:`M${x} ${y} L${x+24} ${y-10} L${x+24} ${y+10} Z`,fill:'#1D3557',opacity:.65}));});
  svg.appendChild(cg);
  /* ground */
  svg.appendChild(el('rect',{x:60,y:872,width:1180,height:48,fill:'#E9EEE3'}));
  svg.appendChild(el('line',{x1:60,y1:872,x2:1240,y2:872,stroke:'#7E9B57','stroke-width':3}));
  const sr=mul(11);
  for(let x=96;x<1200;x+=34){const h=8+Math.round(sr()*3)*5;
    svg.appendChild(el('rect',{x,y:872-h,width:14,height:h,fill:'#7E9B57',opacity:.55}));}
  svg.appendChild(T(1224,902,14,500,'#6E7A63','SOLO · ORGANIZAÇÕES E OPERAÇÃO HOJE','end'));
  host.appendChild(svg);
  /* sinais plotados sobre a anatomia — posição e linha-guia vêm do signals.json.
     Vai depois do appendChild porque a quebra de linha e o fundo dos rótulos
     dependem de medir o texto já renderizado. */
  c.sinais.forEach(s=>plotarSinal(svg,s));
}

/* quebra gulosa pela largura real do texto renderizado */
function quebrar(host,txt,maxw,size,weight,fam){
  const probe=T(-9999,-9999,size,weight,'#000','',null,fam);
  host.appendChild(probe);
  const larg=t=>{probe.textContent=t;return probe.getComputedTextLength();};
  const out=[]; let ln='';
  for(const w of txt.split(' ')){
    const t=ln?ln+' '+w:w;
    if(ln && larg(t)>maxw){out.push(ln);ln=w;} else ln=t;
  }
  if(ln)out.push(ln);
  /* órfã: última linha com uma palavra solta puxa palavras da linha de cima */
  while(out.length>1 && larg(out[out.length-1])<maxw*.25){
    const acima=out[out.length-2].split(' ');
    if(acima.length<2) break;
    const cand=acima[acima.length-1]+' '+out[out.length-1];
    if(larg(cand)>maxw) break;
    acima.pop();
    out[out.length-2]=acima.join(' ');
    out[out.length-1]=cand;
  }
  probe.remove();
  return out;
}

function plotarSinal(svg,s){
  const g=el('g'); svg.appendChild(g);
  if(s.lead) g.appendChild(el('line',{x1:s.lead[0],y1:s.lead[1],x2:s.lead[2],y2:s.lead[3],
    stroke:'#1D3557','stroke-width':1.5,'stroke-dasharray':'5 6',opacity:.42}));
  const tg=el('g'); g.appendChild(tg);
  tg.appendChild(el('rect',{x:s.x,y:s.y-20,width:44,height:26,fill:'#fff',stroke:s.cor,'stroke-width':2}));
  tg.appendChild(T(s.x+22,s.y-1,14,500,s.cor,s.id,'middle'));
  /* a coluna da esquerda vai até a nuvem; a da direita, até a borda do painel */
  const BORDA=1232;
  const maxNome=s.x<500?200:BORDA-(s.x+56), maxEv=s.x<500?330:BORDA-s.x;
  const linhas=quebrar(tg,s.nome,maxNome,21,600,'var(--sans)');
  linhas.forEach((ln,i)=>tg.appendChild(T(s.x+56,s.y-1+i*28,21,600,'#1D3557',ln,null,'var(--sans)')));
  const yp=s.y-1+(linhas.length-1)*28+30;
  tg.appendChild(T(s.x,yp,15,500,s.cor,s.papel));
  let ye=yp+26;
  s.ev.forEach(e=>{
    quebrar(tg,e,maxEv,14,400,'var(--mono)').forEach(ln=>{
      tg.appendChild(T(s.x,ye,14,400,'#5F6B7A',ln)); ye+=21;
    });
    ye+=3;
  });
  /* fundo: o rótulo precisa continuar legível sobre o mosaico e sobre as
     linhas de cisalhamento */
  const bb=tg.getBBox(), topo=bb.y-7;
  g.insertBefore(el('rect',{x:bb.x-9,y:topo,width:bb.width+18,
    height:Math.min(bb.height+14,870-topo),   /* não avança sobre o solo */
    rx:5,fill:'#fff',opacity:.9}),tg);
}

      <div class="k">PREVISÃO</div>
      <p>${c.prev}</p>
      <p class="se">SE A FORMAÇÃO SE CONFIRMAR · ${c.se}</p>
    </div>`;
  document.getElementById('cells').appendChild(s);
  drawCloud(document.getElementById('cloud-'+c.id),c);
}

function buildSystem(){
  document.getElementById('sys').innerHTML=D.sistema.map(l=>`
    <div class="lvl" style="--c:${l.cor}"><div class="n">${l.nivel}</div>
      <div class="d">${l.def}</div><div class="b">${l.ex}</div></div>`).join('');
  document.getElementById('routes').innerHTML=D.colisoes.map(r=>`
    <div class="rt${r.principal?' main':''}"><b>${r.rota}</b><span>${r.tempestade}</span></div>`).join('');
}
</script>
