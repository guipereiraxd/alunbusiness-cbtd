title: "Alun Business"
description: "Transformando seu negócio para além da IA — estratégia, educação corporativa e ferramentas práticas para líderes de T&D e RH."
author: "Guilherme Luiz Pereira"
url: "https://alunbusiness.md"
baseurl: ""

theme: jekyll-theme-cayman

collections:
  casos:
    output: true
    permalink: /setorpublico/casos/:name/
  observatorio:
    output: true
    permalink: /setorpublico/observatorio/:name/

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

include:
  - contexto
  - aprendizados
  - agentes
  - maturidade
  - boas-praticas
  - recursos
  - workshop
  - calculadora-roi
  - curso-ia
  - bancodobrasil
  - china
  - setorpublico

exclude:
  - china/china-repositorio

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "bancodobrasil"
      type: "pages"
    values:
      layout: "bancodobrasil"
  - scope:
      path: "china"
      type: "pages"
    values:
      layout: "china"
  - scope:
      path: "setorpublico"
      type: "pages"
    values:
      layout: "setorpublico"
  - scope:
      path: ""
      type: "casos"
    values:
      layout: "caso"
  - scope:
      path: ""
      type: "observatorio"
    values:
      layout: "referencia"
